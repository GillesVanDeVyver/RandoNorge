<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1018" />
    <link rel="canonical" href="https://fjellrute.no/" />
    <meta
      name="description"
      content="Fjellrute — turplanlegger for topptur og fjelltur i Norge. Kommer snart. / A tour planner for backcountry skiing and mountain hiking in Norway."
    />
    <title>Fjellrute</title>
    <!--
      Public holding page served at the site root (worker/index.js serves this
      for "/"). Testers go straight to /alpha/, which loads the real app.
      Standalone + self-contained on purpose: no bundler, no Google Fonts (same
      privacy stance as the app), so it renders instantly and independently of
      the SPA build.

      DELIBERATELY ALMOST EMPTY. This page used to carry a full explanation of
      the product, several hundred words in two languages, because the site root
      was the URL declared as the "Application home page" on the Google OAuth
      consent screen, and that review requires the home page to explain the app.
      None of that content was ever aimed at visitors.

      On 2026-07-29 the two audiences were separated. The explanatory content
      moved verbatim to public/about.html, the consent screen was repointed
      there, and this page went back to being what a pre-launch root should be:
      the wordmark, and a line saying the product is on its way.

      SO: do not restore the explanation here, and — more importantly — do not
      point the OAuth consent screen at "/" again. Doing so submits a nearly
      blank page to a check that failed once already for exactly that reason.
      The home-page URL is recorded in docs/AUTH_SETUP.md; the content
      requirements it has to satisfy are documented at the top of
      public/about.html. scripts/verify-landing-page.mjs enforces the split.

      The app name is kept as real visible text in the <h1> because it is
      cheap and because the name is the one thing a visitor at the root should
      be certain of.

      The seasonal background photo mirrors the login page — same files in
      public/, same season-by-month logic (src/theme/season.ts) and the same
      scrim/typography (src/components/LoginPage.module.css). Keep in sync if
      the login look changes.
    -->
    <style>
      :root {
        --accent: #2dd4bf;
        --accent-contrast: #04241f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b1018;
      }
      body {
        font-family:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
      }
      /* One locked viewport. Nothing scrolls, because there is nothing below. */
      .page {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(20px, 5vw, 56px);
        /* Season photo set on .page by the inline script below; the CSS var
           falls back to the winter shot while it resolves. */
        background:
          var(--season-photo, url('/login-backcountry.jpg')) center / cover
            no-repeat,
          #dfe7ee;
      }
      /* Even scrim, darker than the login page's left-weighted one: the content
         is centred here, so there is no calm corner to aim for. */
      .scrim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(8, 18, 28, 0.52) 0%,
          rgba(8, 18, 28, 0.44) 50%,
          rgba(8, 18, 28, 0.6) 100%
        );
      }
      .center {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .brandIcon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        margin-bottom: 26px;
        border-radius: 16px;
        background: var(--accent);
        color: var(--accent-contrast);
        box-shadow: 0 10px 30px rgba(8, 18, 28, 0.35);
      }
      .brandIcon svg {
        width: 38px;
        height: 38px;
      }
      /* The wordmark, and the page's only level-one heading. */
      .appName {
        margin: 0;
        font-size: clamp(46px, 8vw, 92px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #fff;
        text-shadow: 0 2px 28px rgba(8, 18, 28, 0.5);
      }
      .soon {
        margin: 22px 0 0;
        font-size: clamp(15px, 1.6vw, 19px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.88);
        text-shadow: 0 1px 14px rgba(8, 18, 28, 0.55);
      }
      /* Thin accent rule between the name and the line below it. */
      .rule {
        width: 56px;
        height: 2px;
        margin: 26px 0 0;
        border-radius: 2px;
        background: var(--accent);
        opacity: 0.9;
      }
      /* Both languages ship in the HTML so the page reads correctly without
         JavaScript; the script only sets `hidden` on the one the visitor does
         not need. `!important` is load-bearing: the UA's `[hidden]` rule loses
         to any class-based `display`, which would show both at once. */
      [data-lang-block][hidden] {
        display: none !important;
      }
      /* Photographer credit, bottom-right — matches the login page's respect
         for the Pexels license (attribution not required, but given). */
      .credit {
        position: absolute;
        right: clamp(14px, 3vw, 36px);
        bottom: clamp(12px, 2.5vw, 24px);
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.62);
        text-shadow: 0 1px 6px rgba(8, 18, 28, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="scrim" aria-hidden="true"></div>

      <div class="center">
        <span class="brandIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <g
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1.5 20 L6.5 8.5 L9.5 12.5 L13 5.5 L17.5 17 L19.5 14.5 L22.5 20 Z" />
              <path
                d="M18.5 19.9 C 13 19 10.5 16.5 12 13.8 C 13 11.9 12.9 9.6 12.95 7.8"
                stroke-width="1.8"
              />
            </g>
          </svg>
        </span>

        <h1 class="appName">Fjellrute</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="soon" data-lang-block="nb" lang="nb">Kommer snart</p>
        <p class="soon" data-lang-block="en" lang="en">Coming soon</p>
      </div>

      <div class="credit" data-credit>Foto: Alois Lackner</div>
    </div>

    <script>
      // Season by month, mirroring seasonFromDate() in src/theme/season.ts:
      // Mar–May spring, Jun–Aug summer, Sep–Nov fall, Dec–Feb winter.
      (function () {
        var PHOTOS = {
          spring: { src: '/login-spring.jpg', credit: 'Andrei Tanase' },
          summer: { src: '/login-summer.jpg', credit: 'Andrei Tanase' },
          fall: { src: '/login-fall.jpg', credit: 'Anastassiya Golovko' },
          winter: { src: '/login-backcountry.jpg', credit: 'Alois Lackner' },
        };
        var m = new Date().getMonth();
        var season =
          m >= 2 && m <= 4
            ? 'spring'
            : m >= 5 && m <= 7
              ? 'summer'
              : m >= 8 && m <= 10
                ? 'fall'
                : 'winter';
        var photo = PHOTOS[season];
        var page = document.querySelector('.page');
        if (page)
          page.style.setProperty('--season-photo', "url('" + photo.src + "')");

        // Norwegian by default (the app's default), English for clearly
        // non-Norwegian browsers. Both strings are already in the HTML, so this
        // only hides the one the visitor does not need.
        var lang = (navigator.language || 'nb').toLowerCase();
        var en = !(
          lang.indexOf('nb') === 0 ||
          lang.indexOf('nn') === 0 ||
          lang.indexOf('no') === 0
        );
        var keep = en ? 'en' : 'nb';
        document.documentElement.lang = keep;
        var blocks = document.querySelectorAll('[data-lang-block]');
        for (var i = 0; i < blocks.length; i++) {
          if (blocks[i].getAttribute('data-lang-block') !== keep)
            blocks[i].hidden = true;
        }
        var credit = document.querySelector('[data-credit]');
        if (credit)
          credit.textContent = (en ? 'Photo: ' : 'Foto: ') + photo.credit;
      })();
    </script>
  </body>
</html>
